---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: psap-agent-staging
  namespace: psap-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: psap-agent-staging
  template:
    metadata:
      labels:
        app: psap-agent-staging
    spec:
      containers:
      - name: agent
        image: quay.io/<your-username>/psap-agent:latest  # UPDATE to your registry
        ports:
        - containerPort: 5002
          name: http
        env:
        - name: AGENT_PORT
          value: "5002"
        - name: POSTGRES_HOST
          value: "psap-postgres"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_PASSWORD
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: GOOGLE_API_KEY
        - name: MCP_SERVER_URL
          value: "http://psap-mcp-server-staging:5001/mcp/"
        - name: ENABLE_PROMPT_CACHING
          value: "true"
        - name: CACHE_TTL_HOURS
          value: "4"
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-api-keys
              key: LANGFUSE_PUBLIC_KEY
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-api-keys
              key: LANGFUSE_SECRET_KEY
        - name: LANGFUSE_HOST
          value: "http://langfuse:3000"
        - name: LANGFUSE_TRACING_ENVIRONMENT
          value: "staging"
        - name: ANTHROPIC_VERTEX_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: ANTHROPIC_VERTEX_PROJECT_ID
        - name: CLOUD_ML_REGION
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: CLOUD_ML_REGION
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/secrets/gcp/sa-key.json"
        - name: MEM0_QDRANT_PATH
          value: "/app/qdrant_data"
        volumeMounts:
        - name: gcp-vertex-sa
          mountPath: /var/secrets/gcp
          readOnly: true
        - name: mem0-data
          mountPath: /app/qdrant_data
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: gcp-vertex-sa
        secret:
          secretName: gcp-vertex-sa
      - name: mem0-data
        persistentVolumeClaim:
          claimName: mem0-qdrant-data-staging

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mem0-qdrant-data-staging
  namespace: psap-ai-agent
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: psap-agent-staging
  namespace: psap-ai-agent
spec:
  selector:
    app: psap-agent-staging
  ports:
  - port: 5002
    targetPort: 5002
    protocol: TCP
  type: ClusterIP
