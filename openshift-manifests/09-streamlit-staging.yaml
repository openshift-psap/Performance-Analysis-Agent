---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-ui-staging
  namespace: psap-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streamlit-ui-staging
  template:
    metadata:
      labels:
        app: streamlit-ui-staging
    spec:
      containers:
      - name: streamlit
        image: quay.io/<your-username>/streamlit-ui:latest  # UPDATE to your registry
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: AGENT_API_URL
          value: "http://psap-agent-staging:5002"
        - name: APP_TITLE
          value: "Staging Performance Analysis Agent"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: streamlit-ui-staging
  namespace: psap-ai-agent
spec:
  selector:
    app: streamlit-ui-staging
  ports:
  - port: 8501
    targetPort: 8501
    protocol: TCP
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: streamlit-ui-staging
  namespace: psap-ai-agent
spec:
  to:
    kind: Service
    name: streamlit-ui-staging
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: aidash-agent-staging
  namespace: psap-ai-agent
  labels:
    app: streamlit-ui-staging
spec:
  host: aidash-agent-staging.apps.<your-cluster-domain>
  to:
    kind: Service
    name: streamlit-ui-staging
    weight: 100
  port:
    targetPort: 8501
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
