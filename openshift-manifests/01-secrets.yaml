---
apiVersion: v1
kind: Secret
metadata:
  name: psap-secrets
  namespace: psap-ai-agent
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_USER: "psap_user"
  POSTGRES_PASSWORD: "CHANGE_ME_STRONG_PASSWORD"  # CHANGE THIS
  POSTGRES_DB: "psap"

  # Google Gemini API Key
  GOOGLE_API_KEY: "CHANGE_ME_YOUR_GOOGLE_API_KEY"  # CHANGE THIS

  # Grafana Credentials (optional)
  GRAFANA_API_TOKEN: "CHANGE_ME_YOUR_GRAFANA_TOKEN"  # CHANGE THIS (or remove if not using)
  GRAFANA_URL: "https://your-grafana-url"  # CHANGE THIS (or remove if not using)
  GRAFANA_DATASOURCE_UID: "your-datasource-uid"  # CHANGE THIS (or remove if not using)

  # Langfuse v3 Auth Secrets
  # Generate with: openssl rand -base64 32
  NEXTAUTH_SECRET: "CHANGE_ME_GENERATE_WITH_OPENSSL"  # CHANGE THIS
  LANGFUSE_SALT: "CHANGE_ME_GENERATE_WITH_OPENSSL"  # CHANGE THIS
  # Generate with: openssl rand -hex 32
  ENCRYPTION_KEY: "CHANGE_ME_GENERATE_WITH_OPENSSL"  # CHANGE THIS

---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-v3-infra
  namespace: psap-ai-agent
type: Opaque
stringData:
  # ClickHouse
  CLICKHOUSE_USER: "clickhouse"
  CLICKHOUSE_PASSWORD: "CHANGE_ME_CLICKHOUSE_PASSWORD"  # CHANGE THIS

  # Redis
  REDIS_AUTH: "CHANGE_ME_REDIS_PASSWORD"  # CHANGE THIS

  # MinIO (S3-compatible storage)
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_MINIO_PASSWORD"  # CHANGE THIS (min 8 chars)

---
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-api-keys
  namespace: psap-ai-agent
type: Opaque
stringData:
  # These will be generated after Langfuse is deployed and you create a project
  # 1. Deploy Langfuse, open the Route URL in browser
  # 2. Create an account and project
  # 3. Go to Settings -> API Keys -> Create API Key
  # 4. Paste the keys here and re-apply this secret
  LANGFUSE_PUBLIC_KEY: "WILL_BE_GENERATED"  # Replace after Langfuse setup
  LANGFUSE_SECRET_KEY: "WILL_BE_GENERATED"  # Replace after Langfuse setup
