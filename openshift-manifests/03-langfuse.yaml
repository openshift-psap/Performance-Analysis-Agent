# =============================================================================
# Langfuse v3 Stack for OpenShift
# Components: ClickHouse, Redis, MinIO, Langfuse Worker, Langfuse Web
# =============================================================================

# --- PersistentVolumeClaims ---

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: psap-ai-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: psap-ai-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

# --- ClickHouse Memory Config ---
# ClickHouse can't read cgroup memory limits on OpenShift, so it must be
# told explicitly how much memory it may use. Without this, it assumes it
# has access to the entire host RAM and will be OOMKilled.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-memory-config
  namespace: psap-ai-agent
data:
  memory-limit.xml: |
    <clickhouse>
        <!-- Cap ClickHouse server memory at 12 GB (container limit is 16 Gi) -->
        <max_server_memory_usage>12000000000</max_server_memory_usage>
        <!-- Disable auto-detection (broken on OpenShift -- no cgroup access) -->
        <max_server_memory_usage_to_ram_ratio>1</max_server_memory_usage_to_ram_ratio>
        <merge_tree>
            <max_bytes_to_merge_at_max_space_in_pool>1073741824</max_bytes_to_merge_at_max_space_in_pool>
        </merge_tree>
        <!-- Send logs to console (stdout/stderr) for OpenShift log viewer -->
        <logger>
            <level>information</level>
            <console>1</console>
            <log>/var/log/clickhouse-server/clickhouse-server.log</log>
            <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
            <size>100M</size>
            <count>3</count>
        </logger>
        <!-- Per-query memory limit (user-level setting via profiles) -->
        <profiles>
            <default>
                <max_memory_usage>4000000000</max_memory_usage>
            </default>
        </profiles>
    </clickhouse>

# --- ClickHouse ---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-clickhouse
  namespace: psap-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-clickhouse
  template:
    metadata:
      labels:
        app: langfuse-clickhouse
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.3-alpine
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        env:
        - name: CLICKHOUSE_DB
          value: "default"
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_PASSWORD
        volumeMounts:
        - name: clickhouse-storage
          mountPath: /var/lib/clickhouse
        - name: clickhouse-logs
          mountPath: /var/log/clickhouse-server
        - name: clickhouse-tmp
          mountPath: /tmp
        - name: clickhouse-memory-config
          mountPath: /etc/clickhouse-server/config.d/memory-limit.xml
          subPath: memory-limit.xml
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: clickhouse-storage
        persistentVolumeClaim:
          claimName: clickhouse-data
      - name: clickhouse-logs
        emptyDir: {}
      - name: clickhouse-tmp
        emptyDir: {}
      - name: clickhouse-memory-config
        configMap:
          name: clickhouse-memory-config

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-clickhouse
  namespace: psap-ai-agent
spec:
  selector:
    app: langfuse-clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 9000
    targetPort: 9000
  type: ClusterIP

# --- Redis ---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-redis
  namespace: psap-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-redis
  template:
    metadata:
      labels:
        app: langfuse-redis
    spec:
      containers:
      - name: redis
        image: redis:7
        ports:
        - containerPort: 6379
          name: redis
        command: ["redis-server"]
        args:
        - "--requirepass"
        - "$(REDIS_AUTH)"
        - "--maxmemory-policy"
        - "noeviction"
        - "--save"
        - ""
        - "--appendonly"
        - "no"
        env:
        - name: REDIS_AUTH
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: REDIS_AUTH
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-redis
  namespace: psap-ai-agent
spec:
  selector:
    app: langfuse-redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP

# --- MinIO (S3-compatible storage) ---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-minio
  namespace: psap-ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-minio
  template:
    metadata:
      labels:
        app: langfuse-minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        command: ["sh", "-c"]
        args:
        - "mkdir -p /data/langfuse && minio server --address ':9000' --console-address ':9001' /data"
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-data

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-minio
  namespace: psap-ai-agent
spec:
  selector:
    app: langfuse-minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: ClusterIP

# --- Langfuse Worker ---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: psap-ai-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      containers:
      - name: langfuse-worker
        image: langfuse/langfuse-worker:3
        env:
        # --- PostgreSQL ---
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@psap-postgres:5432/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_DB
        # --- Auth secrets ---
        - name: NEXTAUTH_URL
          value: "https://langfuse-psap-ai-agent.apps.your-cluster.com"  # UPDATE after route is created
        - name: SALT
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: LANGFUSE_SALT
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: ENCRYPTION_KEY
        - name: TELEMETRY_ENABLED
          value: "false"
        # --- ClickHouse ---
        - name: CLICKHOUSE_MIGRATION_URL
          value: "clickhouse://langfuse-clickhouse:9000"
        - name: CLICKHOUSE_URL
          value: "http://langfuse-clickhouse:8123"
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        # --- Redis ---
        - name: REDIS_HOST
          value: "langfuse-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_AUTH
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: REDIS_AUTH
        - name: REDIS_TLS_ENABLED
          value: "false"
        # --- MinIO (S3-compatible storage) ---
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_USER
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_PASSWORD
        - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
          value: "http://langfuse-minio:9000"
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_USER
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_PASSWORD
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: "http://langfuse-minio:9000"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
          value: "false"
        - name: LANGFUSE_USE_AZURE_BLOB
          value: "false"
        - name: NODE_OPTIONS
          value: "--max-old-space-size=3072"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

# --- Langfuse Web ---

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: psap-ai-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
    spec:
      containers:
      - name: langfuse-web
        image: langfuse/langfuse:3
        ports:
        - containerPort: 3000
          name: http
        env:
        # --- PostgreSQL ---
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@psap-postgres:5432/$(POSTGRES_DB)"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: POSTGRES_DB
        # --- Auth secrets ---
        - name: NEXTAUTH_URL
          value: "https://langfuse-psap-ai-agent.apps.your-cluster.com"  # UPDATE after route is created
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: NEXTAUTH_SECRET
        - name: SALT
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: LANGFUSE_SALT
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: psap-secrets
              key: ENCRYPTION_KEY
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: TELEMETRY_ENABLED
          value: "false"
        # --- Init config (first-run only) ---
        - name: LANGFUSE_INIT_PROJECT_NAME
          value: "PSAP Agent"
        - name: LANGFUSE_INIT_USER_EMAIL
          value: "admin@example.com"  # CHANGE to your email
        - name: LANGFUSE_INIT_USER_PASSWORD
          value: "CHANGE_ME_ADMIN_PASSWORD"  # CHANGE THIS
        # --- ClickHouse ---
        - name: CLICKHOUSE_MIGRATION_URL
          value: "clickhouse://langfuse-clickhouse:9000"
        - name: CLICKHOUSE_URL
          value: "http://langfuse-clickhouse:8123"
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_USER
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: CLICKHOUSE_PASSWORD
        - name: CLICKHOUSE_CLUSTER_ENABLED
          value: "false"
        # --- Redis ---
        - name: REDIS_HOST
          value: "langfuse-redis"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_AUTH
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: REDIS_AUTH
        - name: REDIS_TLS_ENABLED
          value: "false"
        # --- MinIO (S3-compatible storage) ---
        - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_USER
        - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_PASSWORD
        - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
          value: "http://langfuse-minio:9000"
        - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
          value: "events/"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
          value: "langfuse"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
          value: "auto"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_USER
        - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langfuse-v3-infra
              key: MINIO_ROOT_PASSWORD
        - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
          value: "http://langfuse-minio:9000"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
          value: "true"
        - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
          value: "media/"
        - name: LANGFUSE_S3_BATCH_EXPORT_ENABLED
          value: "false"
        - name: LANGFUSE_USE_AZURE_BLOB
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/public/health
            port: 3000
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/public/health
            port: 3000
          initialDelaySeconds: 45
          periodSeconds: 10

# --- Service: langfuse (web) ---
# Named "langfuse" (not "langfuse-web") to preserve compatibility with
# the agent's LANGFUSE_HOST=http://langfuse:3000

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse
  namespace: psap-ai-agent
spec:
  selector:
    app: langfuse-web
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

# --- Route ---

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse
  namespace: psap-ai-agent
spec:
  to:
    kind: Service
    name: langfuse
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
